name: Sync SKILL.md to simpl_knowledge

# When .agent/SKILL.md is updated on main, publish it straight to simpl_knowledge
# main — no PR. The logic lives in simpl_knowledge (scripts/ci/apply-library-sync.py):
# apply + semver + provenance, validate, commit, push; a push race with another
# library is retried on the fresh main. A red run here means nothing was published.

on:
  push:
    branches: [main]
    paths:
      - '.agent/SKILL.md'

  workflow_dispatch:

concurrency:
  group: sync-simpl_knowledge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Require SIMPL_KNOWLEDGE_PAT
        env:
          SIMPL_KNOWLEDGE_PAT: ${{ secrets.SIMPL_KNOWLEDGE_PAT }}
        run: |
          if [ -z "${SIMPL_KNOWLEDGE_PAT}" ]; then
            echo "::error::Missing Actions secret SIMPL_KNOWLEDGE_PAT (needed to push to simpl_knowledge main). See docs/human/ADMIN_SETUP.md."
            exit 1
          fi

      - name: Checkout this repo
        uses: actions/checkout@v5
        with:
          path: source

      - name: Checkout simpl_knowledge
        uses: actions/checkout@v5
        with:
          repository: simpl-techs/simpl_knowledge
          path: marketplace
          token: ${{ secrets.SIMPL_KNOWLEDGE_PAT }}

      - name: Publish SKILL.md to simpl_knowledge main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 marketplace/scripts/ci/apply-library-sync.py \
            --library-root "$GITHUB_WORKSPACE/source" \
            --marketplace-root "$GITHUB_WORKSPACE/marketplace" \
            --repo-name "${GITHUB_REPOSITORY##*/}" \
            --full-repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA"
